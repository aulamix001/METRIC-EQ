name: Windows VST3
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-vst3-publication
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Release and Debug
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -Configuration Release
          ./scripts/build-windows.ps1 -Configuration Debug
      - name: Validate VST3 with pluginval 1.0.4
        shell: pwsh
        run: ./scripts/validate-windows.ps1
      - name: Package and verify Windows binary
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CHi-Metric-Match-Pro-Windows-x64
          path: |
            dist/*.zip
            dist/*.txt
            dist/*.json
          if-no-files-found: error
      - name: Publish immutable prerelease
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'audited-foundation-${{ github.run_number }}-${{ github.run_attempt }}'
          gh release create $tag dist/CHi-Metric-Match-Pro-Windows-x64.zip dist/SHA256SUMS.txt dist/BUILD-INFO.json --target '${{ github.sha }}' --prerelease --title 'CHi Metric Match Pro - Audited Foundation' --notes 'FOUNDATION ONLY. Implemented: unity pass-through, mapped bypass, saved state, initial editor. Tests in Release/Debug and pluginval strictness 5. A/B, reference playback, gains, filters, FFT, loudness, EQ Match and the concept UI are NOT implemented. See docs/AUDIT.md inside ZIP. Not tested in Studio One or REAPER. Unsigned binary.'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Releases unavailable; downloads branch will still be published' }
      - name: Retain validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            build-windows/*.log
            build-windows/Testing/Temporary/*.log
            build-windows/pluginval-logs/*
      - name: Publish verified downloads branch
        shell: pwsh
        run: |
          $source = '${{ github.sha }}'
          $staged = Join-Path $env:RUNNER_TEMP 'metric-download-files'
          New-Item -ItemType Directory -Force $staged | Out-Null
          Copy-Item dist/*.zip,dist/*.txt,dist/*.json $staged/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin windows-downloads
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch downloads branch' }
          git switch --create windows-downloads --track origin/windows-downloads
          if ($LASTEXITCODE -ne 0) { throw 'Cannot switch to downloads branch' }
          Copy-Item "$staged/*" ./ -Force
          git add CHi-Metric-Match-Pro-Windows-x64.zip SHA256SUMS.txt BUILD-INFO.json
          git commit -m "Publish audited Windows foundation from $source"
          if ($LASTEXITCODE -ne 0) { throw 'Downloads commit failed' }
          git push origin HEAD:windows-downloads
          if ($LASTEXITCODE -ne 0) { throw 'Downloads publication failed' }
          $commit = (git rev-parse HEAD).Trim()
          $url = "https://raw.githubusercontent.com/${{ github.repository }}/$commit/CHi-Metric-Match-Pro-Windows-x64.zip"
          $download = Join-Path $env:RUNNER_TEMP 'verified-download.zip'
          curl.exe --fail --location --retry 3 --output $download $url
          if ($LASTEXITCODE -ne 0) { throw 'Published ZIP download failed' }
          $expected = (Get-Content SHA256SUMS.txt).Split(' ')[0]
          if ((Get-FileHash $download).Hash.ToLower() -ne $expected) { throw 'Published download checksum mismatch' }
          Expand-Archive $download (Join-Path $env:RUNNER_TEMP 'verified-download')
          "Verified download: $url`nSHA256: $expected`nSource: $source" >> $env:GITHUB_STEP_SUMMARY
